<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" aria-labelledby="title desc">
  <title id="title">Contact section photo placeholder</title>
  <desc id="desc">An abstract gold and plum placeholder for a welcoming farm photograph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d7af69"/>
      <stop offset=".47" stop-color="#a57b69"/>
      <stop offset="1" stop-color="#69445c"/>
    </linearGradient>
    <pattern id="lines" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M0 72L72 0" stroke="#fff6e5" stroke-opacity=".1" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="720" height="960" fill="url(#bg)"/>
  <rect width="720" height="960" fill="url(#lines)"/>
  <rect x="56" y="56" width="608" height="848" fill="none" stroke="#fff6e5" stroke-opacity=".25"/>
  <g fill="#fffaf0" text-anchor="middle" font-family="Arial, sans-serif">
    <text x="360" y="455" font-size="20" font-weight="700" letter-spacing="4">CONTACT PHOTO</text>
    <text x="360" y="490" font-size="16" opacity=".86">720 × 960 placeholder</text>
  </g>
</svg>
