<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Farm portrait photo placeholder</title>
  <desc id="desc">An abstract plum and green placeholder for a portrait farm photograph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2=".8" y1="0" y2="1">
      <stop offset="0" stop-color="#734a61"/>
      <stop offset=".5" stop-color="#a36c69"/>
      <stop offset="1" stop-color="#556d55"/>
    </linearGradient>
  </defs>
  <rect width="720" height="900" fill="url(#bg)"/>
  <path d="M0 720Q190 530 362 680T720 595V900H0z" fill="#2b4336" fill-opacity=".45"/>
  <path d="M-80 165Q210 30 420 210T800 115" fill="none" stroke="#f5dfb4" stroke-opacity=".22" stroke-width="56"/>
  <g fill="#fffaf0" text-anchor="middle" font-family="Arial, sans-serif">
    <text x="360" y="425" font-size="20" font-weight="700" letter-spacing="4">PORTRAIT PHOTO</text>
    <text x="360" y="460" font-size="16" opacity=".86">720 × 900 placeholder</text>
  </g>
</svg>
